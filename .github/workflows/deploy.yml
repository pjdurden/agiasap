name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # Refresh the recognition board daily. 04:00 UTC is quiet on the GitHub API.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      refresh_board:
        description: "Re-fetch contributor data from the GitHub API"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate data files
        run: python3 validate_data.py

      # Skipped on ordinary pushes so a copy edit does not spend ten minutes and
      # a few hundred API calls. The daily cron and manual runs do the refresh.
      - name: Refresh recognition board
        if: github.event_name == 'schedule' || inputs.refresh_board
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 build_board.py --days 90 --top 50

      - name: Commit refreshed board data
        if: github.event_name == 'schedule' || inputs.refresh_board
        run: |
          if git diff --quiet -- data/contributors.json data/board_meta.json data/treasury.json; then
            echo "board unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributors.json data/board_meta.json data/treasury.json
          git commit -m "chore: refresh recognition board"
          git push

      # Balances are read from public RPCs on every deploy and on the daily
      # cron, so the published figure is never typed in by hand.
      - name: Read the treasury
        continue-on-error: true
        run: python3 read_treasury.py

      - name: Build the site
        run: python3 build_site.py

      - name: No JavaScript may enter the page
        run: |
          if grep -o '<script[^>]*>' index.html | grep -v 'application/ld+json'; then
            echo "::error::index.html contains executable JavaScript."
            exit 1
          fi

      - name: Assemble artifact
        run: |
          mkdir -p _site/data
          cp index.html llms.txt llms-full.txt robots.txt _site/
          cp data/contributors.json data/board_meta.json data/traction.json data/funding.json _site/data/
          cp data/treasury.json _site/data/ 2>/dev/null || true
          cp -r data/signatures _site/data/
          # Only claim a custom domain once it actually exists. A CNAME file for a
          # domain you do not own also breaks the default github.io URL, because
          # Pages redirects there and the name does not resolve.
          if [ -n "${CUSTOM_DOMAIN}" ]; then
            echo "${CUSTOM_DOMAIN}" > _site/CNAME
            echo "custom domain: ${CUSTOM_DOMAIN}"
          else
            echo "no custom domain set; serving from github.io"
          fi
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
