name: Alert on failure

# The point of this project running itself is that you never check on it.
# That only works if a broken run reaches you instead of sitting in a tab.
on:
  workflow_run:
    workflows: ["Build and deploy", "Signature request", "Validate"]
    types: [completed]

jobs:
  tell-me:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 notify.py --failure "${{ github.event.workflow_run.name }}"
