name: Signature request

on:
  issues:
    # Only 'opened'. The form applies the label at creation, so listening for
    # 'labeled' as well fired this twice for every signature and posted the
    # confirmation comment twice. The title fallback below covers the case
    # 'labeled' was originally added for.
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

# Serialise per issue so a re-open or manual re-run queues behind the first
# attempt and sees its result, rather than racing it.
concurrency:
  group: sign-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  open-pr:
    # Title is a fallback for the same reason. Both paths are validated
    # identically, so a looser trigger costs nothing.
    if: >
      contains(github.event.issue.labels.*.name, 'signature') ||
      github.event.issue.title == 'sign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the signature file
        id: sig
        env:
          # The handle comes from the issue author, never from the form body.
          # This is what makes signing as someone else impossible rather than
          # merely discouraged.
          AUTHOR: ${{ github.event.issue.user.login }}
          BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, pathlib, re, sys

          author = os.environ["AUTHOR"]
          body = os.environ["BODY"] or ""

          # GitHub issue forms render as "### Label\n\nvalue\n\n### Label\n\nvalue".
          fields = {}
          for label, value in re.findall(r"^###\s+(.+?)\s*\n+(.*?)(?=\n###\s|\Z)", body, re.S | re.M):
              fields[label.strip().lower()] = value.strip()

          def die(msg):
              """Fail with a reason the signatory can act on, not just a log line."""
              pathlib.Path("sign_error.txt").write_text(msg)
              print(f"::error::{msg}")
              sys.exit(1)

          def get(*names):
              for n in names:
                  v = fields.get(n, "")
                  if v and v.lower() not in ("_no response_", "none", "n/a"):
                      return v
              return ""

          name = get("name") or author
          lane = get("lane").lower()
          affiliation = get("affiliation (optional)", "affiliation")
          url = get("link (optional)", "link", "url")

          LANES = {"infra", "research", "compute", "evals", "signal", "capital"}
          if lane not in LANES:
              die(f"Lane {lane!r} is not one of: {', '.join(sorted(LANES))}")
          if len(name) > 80:
              die("Name is longer than 80 characters.")

          # People type "prajj.com", not "https://prajj.com". Failing a signature
          # over a missing scheme is a pointless way to lose someone, so normalise
          # instead. Storage stays strict; leniency belongs at the input edge.
          if url:
              url = url.strip().rstrip("/")
              if url.startswith("http://"):
                  url = "https://" + url[len("http://"):]
              elif not url.startswith("https://"):
                  url = "https://" + url.lstrip("/")
              if not re.fullmatch(r"https://[\w.-]+\.[a-zA-Z]{2,}(/\S*)?", url):
                  die(f"Could not read {url!r} as a web address. Something like https://example.org")
              print(f"link normalised to {url}")
          if affiliation and len(affiliation) > 60:
              die("Affiliation is longer than 60 characters.")

          path = pathlib.Path("data/signatures") / f"{author.lower()}.json"
          if path.exists():
              die(f"@{author} has already signed. Thank you twice.")

          record = {
              "name": name,
              "github": author,
              "lane": lane,
              "signed": datetime.date.today().isoformat(),
          }
          if affiliation:
              record["affiliation"] = affiliation
          if url:
              record["url"] = url

          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(record, indent=2) + "\n")
          print(f"wrote {path}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"path={path}\n")
              f.write(f"handle={author}\n")
          PY

      - name: Validate before proposing
        run: python3 validate_data.py

      - name: Open the pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HANDLE: ${{ steps.sig.outputs.handle }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          BRANCH="sign/${HANDLE,,}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/signatures/
          git commit -m "sign: @${HANDLE}"
          # Force, because a previous attempt may have left this branch behind.
          # It is bot-owned and named for one handle, so nothing else can be lost.
          git push -f -u origin "$BRANCH"

          # An open PR from an earlier attempt means there is nothing left to do.
          # Record that so the comment step stays quiet instead of thanking them twice.
          if gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' | grep -q .; then
            echo "a pull request for $BRANCH is already open"
            echo "already=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "already=false" >> "$GITHUB_OUTPUT"

          gh pr create \
            --title "sign: @${HANDLE}" \
            --body "Signature requested by @${HANDLE} in #${ISSUE}.

          Handle taken from the issue author, not from the form body.

          Closes #${ISSUE}" \
            --base main --head "$BRANCH"

      - name: Tell them what happened
        if: steps.pr.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body "Thanks. A pull request with your signature is open and will be merged shortly. It will appear on the site at the next build.

          Changed your mind at any point? Say so here or open a pull request deleting your file. Removals are never questioned."

      - name: Report failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          REASON=$(cat sign_error.txt 2>/dev/null || echo "Something went wrong that was not your fault.")
          gh issue comment "$ISSUE" --body "No pull request was opened.

          **${REASON}**

          Edit this issue to correct it and we will pick it up, or just say what you meant and it will be sorted by hand. Full log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
